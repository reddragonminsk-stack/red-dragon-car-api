name: Publish static car cache

# Push, daily schedule, and manual execution; cache commits do not re-trigger this workflow.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'server.js'
      - 'source-fetch-bootstrap.js'
      - 'scripts/publish-cache.js'
      - 'package.json'
      - 'wrangler.json'
      - '.github/workflows/publish-cache.yml'

permissions:
  contents: write

jobs:
  publish-cache:
    if: github.event_name != 'push' || github.event.head_commit.message != 'Refresh static car cache'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Refresh live cache with existing parser
        env:
          PORT: 10000
          PARSER_REFRESH_MS: 86400000
        run: node scripts/publish-cache.js

      - name: Commit refreshed static cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cache/
          if git diff --cached --quiet; then
            echo "Cache unchanged"
            exit 0
          fi
          git commit -m "Refresh static car cache"
          git push
